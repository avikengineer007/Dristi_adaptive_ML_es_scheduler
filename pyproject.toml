[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drishti"
version = "0.1.0"
description = "DRISHTI: Dynamic Reinforcement-learning Intercept Scheduler for Tactical ES Intelligence (SIH 2026 PS 26055)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "DRISHTI Team", email = "drishti-ew@sih2026.gov.in" }
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "gymnasium>=1.0.0",
    "torch>=2.2.0",
    "stable-baselines3>=2.3.0",
    "matplotlib>=3.8.0",
    "plotly>=5.20.0",
    "streamlit>=1.35.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["drishti*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
